name: Build InkBloom Reader APK
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Restore release keystore
        env:
          INKBLOOM_KEYSTORE_BASE64: ${{ secrets.INKBLOOM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$INKBLOOM_KEYSTORE_BASE64" ]; then
            echo "$INKBLOOM_KEYSTORE_BASE64" | base64 --decode > /tmp/inkbloom-release.keystore
          fi
      - name: Build APK (release-signed, stable key for testing)
        env:
          INKBLOOM_STORE_FILE: /tmp/inkbloom-release.keystore
          INKBLOOM_STORE_PASSWORD: ${{ secrets.INKBLOOM_STORE_PASSWORD }}
          INKBLOOM_KEY_ALIAS: ${{ secrets.INKBLOOM_KEY_ALIAS }}
          INKBLOOM_KEY_PASSWORD: ${{ secrets.INKBLOOM_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkbloom-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
